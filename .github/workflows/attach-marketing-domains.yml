name: Attach marketing domains

on:
  push:
    branches:
      - develop
      - cursor/attach-marketing-domains
    paths:
      - '.github/workflows/attach-marketing-domains.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

# Uses the same CF secrets as Deploy API. Does not deploy the Worker
# and never touches api / api.dripnex.app DNS or routes.
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Attach dripnex.app and www to dripnex-marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG=/tmp/attach.log
          : > "$LOG"
          {
            echo "token_len=${#CLOUDFLARE_API_TOKEN} account_len=${#CLOUDFLARE_ACCOUNT_ID}"
            if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
              echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is empty"
              echo FAIL > /tmp/attach.status
              exit 0
            fi

            AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
            ACCOUNT="${CLOUDFLARE_ACCOUNT_ID}"
            TARGET="dripnex-marketing"
            CF="https://api.cloudflare.com/client/v4"
            echo FAIL > /tmp/attach.status

            echo "GET pages/projects"
            PROJECTS="$(curl -sS "${CF}/accounts/${ACCOUNT}/pages/projects?per_page=50" -H "$AUTH" -H "Content-Type: application/json")"
            echo "$PROJECTS" | jq -c '{success,errors,names:[.result[]?.name]}'

            echo "$PROJECTS" | jq -r '.result[]?.name' | while read -r project; do
              [ -n "$project" ] || continue
              DOMS="$(curl -sS "${CF}/accounts/${ACCOUNT}/pages/projects/${project}/domains" -H "$AUTH" -H "Content-Type: application/json")"
              echo "$DOMS" | jq -c --arg p "$project" '{project:$p,success,errors,domains:[.result[]?.name]}'
              [ "$project" = "$TARGET" ] && continue
              echo "$DOMS" | jq -r '.result[]? | select(.name=="dripnex.app" or .name=="www.dripnex.app") | .name' \
                | while read -r d; do
                    echo "detaching ${d} from ${project}"
                    curl -sS -X DELETE "${CF}/accounts/${ACCOUNT}/pages/projects/${project}/domains/${d}" -H "$AUTH" | jq -c '{success,errors}'
                  done
            done

            for host in dripnex.app www.dripnex.app; do
              echo "POST domain ${host}"
              curl -sS -X POST "${CF}/accounts/${ACCOUNT}/pages/projects/${TARGET}/domains" \
                -H "$AUTH" -H "Content-Type: application/json" \
                --data "{\"name\":\"${host}\"}" | jq -c '{name:.result.name,status:.result.status,success,errors}'
            done

            ZONE="$(curl -sS "${CF}/zones?name=dripnex.app" -H "$AUTH")"
            echo "$ZONE" | jq -c '{success,errors,zone:(.result[0]|.id),name:(.result[0]|.name)}'
            ZONE_ID="$(echo "$ZONE" | jq -r '.result[0].id // empty')"
            echo "zone=${ZONE_ID}"

            for fqdn in dripnex.app www.dripnex.app; do
              echo "DNS ${fqdn}"
              recs="$(curl -sS "${CF}/zones/${ZONE_ID}/dns_records?name=${fqdn}&per_page=100" -H "$AUTH")"
              echo "$recs" | jq -c --arg n "$fqdn" '{name:$n,success,errors,records:[.result[]? | {id,type,name,content,proxied}]}'
              keep="$(echo "$recs" | jq -r '.result[]? | select(.type=="CNAME" and ((.content|ascii_downcase)=="dripnex-marketing.pages.dev")) | .id' | head -n1)"
              if [ -n "$keep" ]; then
                proxied="$(echo "$recs" | jq -r --arg id "$keep" '.result[]? | select(.id==$id) | .proxied')"
                echo "existing cname id=${keep} proxied=${proxied}"
                if [ "$proxied" != "true" ]; then
                  curl -sS -X PATCH "${CF}/zones/${ZONE_ID}/dns_records/${keep}" -H "$AUTH" -H "Content-Type: application/json" \
                    --data "{\"type\":\"CNAME\",\"name\":\"${fqdn}\",\"content\":\"dripnex-marketing.pages.dev\",\"proxied\":true}" \
                    | jq -c '{success,errors,updated:.result|{name,type,content,proxied}}'
                fi
              else
                first="$(echo "$recs" | jq -r '.result[]? | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' | head -n1)"
                if [ -n "$first" ]; then
                  echo "PATCH ${fqdn} ${first} -> CNAME dripnex-marketing.pages.dev"
                  curl -sS -X PATCH "${CF}/zones/${ZONE_ID}/dns_records/${first}" -H "$AUTH" -H "Content-Type: application/json" \
                    --data "{\"type\":\"CNAME\",\"name\":\"${fqdn}\",\"content\":\"dripnex-marketing.pages.dev\",\"proxied\":true}" \
                    | jq -c '{success,errors,updated:.result|{name,type,content,proxied}}'
                else
                  echo "POST CNAME ${fqdn}"
                  curl -sS -X POST "${CF}/zones/${ZONE_ID}/dns_records" -H "$AUTH" -H "Content-Type: application/json" \
                    --data "{\"type\":\"CNAME\",\"name\":\"${fqdn}\",\"content\":\"dripnex-marketing.pages.dev\",\"proxied\":true}" \
                    | jq -c '{success,errors,created:.result|{name,type,content,proxied}}'
                fi
              fi
            done
            echo OK > /tmp/attach.status
          } > "$LOG" 2>&1

          echo "===== attach log ====="
          cat "$LOG"
          BODY=$(python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/attach.log').read_text()[-3500:]
          print('```\n' + text.replace('```', "'''") + '\n```')
          PY
          )
          gh api repos/dripnex/app/issues/565/comments -f body="Attach run log:

${BODY}" || true
          test "$(cat /tmp/attach.status)" = OK
