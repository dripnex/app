name: Build & Publish

# Starts after Release succeeds (workflow_run — GITHUB_TOKEN cannot fire
# a sibling workflow via tag push). Dispatch is the retry path.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.16.0'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  NODE_VERSION: '22'
  ELECTRON_CACHE: ~/.cache/electron
  ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

jobs:
  meta:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          elif [ "$EVENT" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            if ! gh run download "$RUN_ID" --name release-version --dir /tmp/release-version --repo "$GITHUB_REPOSITORY"; then
              echo "Release did not cut a version (no artefact). Nothing to build."
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag=$(cat /tmp/release-version/version.txt)
          fi
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve a release tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $tag"

      - name: Ensure release is draft
        id: draft
        if: steps.resolve.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # electron-builder --publish always uploads only to a draft
          # GitHub Release. After notes are already published (or a
          # retry), the tag is existingType=release and every asset is
          # skipped: "existing type not compatible with publishing type".
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --draft --repo "$GITHUB_REPOSITORY"
            echo "Marked $TAG_NAME as draft so electron-builder can upload."
          else
            echo "No existing release for $TAG_NAME; electron-builder will create one."
          fi

          # Draft releases stay untagged until published, so
          # GET /releases/tags/$TAG_NAME 404s. Record the numeric id
          # (list endpoint includes drafts) for the publish job.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG_NAME\") | .id] | first")
          if [ -n "$id" ] && [ "$id" != "null" ]; then
            echo "release_id=$id" >> "$GITHUB_OUTPUT"
            echo "Resolved $TAG_NAME to release id $id"
          else
            echo "No release id yet; publish will look it up after builds."
          fi

  build:
    needs: meta
    if: needs.meta.result == 'success' && needs.meta.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          # Pin Windows runner explicitly. `windows-latest` migrates to
          # `windows-2025-vs2026` on 2026-06-15; pinning ahead avoids a
          # surprise toolchain swap mid-release. Revisit on each new GA.
          - os: windows-2025-vs2026
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - name: Stamp package version from tag
        shell: bash
        run: node scripts/bump-version.mjs "${TAG#v}"
        env:
          TAG: ${{ needs.meta.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ matrix.platform }}-

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-v3-${{ matrix.platform }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: electron-v3-${{ matrix.platform }}-

      - name: Clean electron-builder cache (Linux)
        if: matrix.platform == 'linux'
        run: rm -rf ~/.cache/electron-builder

      - name: Force HTTPS for GitHub git dependencies
        shell: bash
        run: git config --global 'url.https://github.com/.insteadOf' 'git@github.com:'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build Electron app
        working-directory: apps/desktop
        run: pnpm build

      - name: Build distributables (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm dist:mac --publish always

      - name: Build distributables (Windows)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:win --publish always

      - name: Build distributables (Linux)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:linux --publish always

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform }}-build
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          # `error` (was `ignore`) — if the build silently produced zero
          # artefacts (signing failure, electron-builder swallowed an
          # error, wrong working-directory, etc.) we want the job to fail
          # loud here, not let the release un-draft with no installers.
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [meta, build]
    if: needs.meta.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.meta.outputs.tag }}
          RELEASE_ID: ${{ needs.meta.outputs.release_id }}
        run: |
          set -euo pipefail
          # `gh release edit $TAG --draft=false` looks up
          # GET /releases/tags/$TAG, which 404s for drafts. v0.19.1
          # built mac/win/linux then failed publish with "release not
          # found" because the draft was still untagged. PATCH by id.
          id="${RELEASE_ID:-}"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            for attempt in 1 2 3 4 5 6; do
              id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq "[.[] | select(.tag_name == \"$TAG_NAME\") | .id] | first")
              if [ -n "$id" ] && [ "$id" != "null" ]; then
                break
              fi
              echo "Release $TAG_NAME not listed yet (attempt $attempt); retrying..."
              sleep 5
              id=""
            done
          fi
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::No GitHub Release found for $TAG_NAME (including drafts)."
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
            -F draft=false \
            -f tag_name="$TAG_NAME" \
            --jq '"Published \(.tag_name) -> \(.html_url)"'

  sync-develop:
    needs: [meta, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A `develop <- main` PR cannot merge: develop requires the head branch
      # to be up to date, and main is behind develop the moment anything lands
      # after the release. Push a branch descended from develop with main
      # merged into it instead — that satisfies the rule and, unlike a squash,
      # actually makes main an ancestor of develop so the next promotion is
      # not stuck at BEHIND.
      - name: Open the back-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main develop

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "main is already an ancestor of develop; nothing to sync."
            exit 0
          fi

          # The chore/backmerge- prefix keeps this out of the squash
          # auto-merge in automerge.yml. Squashing it would defeat the point.
          branch="chore/backmerge-main-${TAG_NAME}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists; leaving the open PR alone."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch" origin/develop
          git merge origin/main -m "chore(release): merge main into develop"
          git push origin "$branch"

          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore(release): merge main into develop" \
            --body "Back-merge of $TAG_NAME so main stays an ancestor of develop and the next promotion PR is not stuck at BEHIND.

          Merge this with a **merge commit**. A squash replays the content as a new commit and does not establish ancestry." \
            --repo "$GITHUB_REPOSITORY"

          # Explicitly a merge commit. automerge.yml skips chore/backmerge-*,
          # so nothing else will arm this with --squash.
          gh pr merge "$branch" --auto --merge --repo "$GITHUB_REPOSITORY"
