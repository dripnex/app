name: Build & Publish

# Starts after Release succeeds (workflow_run — GITHUB_TOKEN cannot fire
# a sibling workflow via tag push). Dispatch is the retry path.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.16.0'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  NODE_VERSION: '22'
  ELECTRON_CACHE: ~/.cache/electron
  ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

jobs:
  meta:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          elif [ "$EVENT" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            if ! gh run download "$RUN_ID" --name release-version --dir /tmp/release-version --repo "$GITHUB_REPOSITORY"; then
              echo "Release did not cut a version (no artefact). Nothing to build."
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag=$(cat /tmp/release-version/version.txt)
          fi
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve a release tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $tag"

  build:
    needs: meta
    if: needs.meta.result == 'success' && needs.meta.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          # Pin Windows runner explicitly. `windows-latest` migrates to
          # `windows-2025-vs2026` on 2026-06-15; pinning ahead avoids a
          # surprise toolchain swap mid-release. Revisit on each new GA.
          - os: windows-2025-vs2026
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ matrix.platform }}-

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-v3-${{ matrix.platform }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: electron-v3-${{ matrix.platform }}-

      - name: Clean electron-builder cache (Linux)
        if: matrix.platform == 'linux'
        run: rm -rf ~/.cache/electron-builder

      - name: Force HTTPS for GitHub git dependencies
        shell: bash
        run: git config --global 'url.https://github.com/.insteadOf' 'git@github.com:'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build Electron app
        working-directory: apps/desktop
        run: pnpm build

      - name: Build distributables (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm dist:mac --publish always

      - name: Build distributables (Windows)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:win --publish always

      - name: Build distributables (Linux)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:linux --publish always

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform }}-build
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap
          # `error` (was `ignore`) — if the build silently produced zero
          # artefacts (signing failure, electron-builder swallowed an
          # error, wrong working-directory, etc.) we want the job to fail
          # loud here, not let the release un-draft with no installers.
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [meta, build]
    if: needs.meta.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.meta.outputs.tag }}
        run: gh release edit "$TAG_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

  sync-develop:
    needs: [meta, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! pr_count="$(gh pr list --base develop --head main --repo "$GITHUB_REPOSITORY" --json number --jq 'length')"; then
            echo "::error::Unable to check for an existing sync PR."
            exit 1
          fi
          if [ "$pr_count" -eq 0 ]; then
            gh pr create \
              --base develop \
              --head main \
              --title "chore: sync release $TAG_NAME back to develop" \
              --body "Auto sync of release commit and changelog from $TAG_NAME." \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "Sync PR already open; nothing to create."
          fi
