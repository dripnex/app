name: Release

# Cut a version when main moves. No PAT, no "Run workflow" button.
# The bump commit uses [skip ci] so this does not loop.
#
# Build & Publish starts from workflow_run (GITHUB_TOKEN cannot fire
# on: push tags). See docs/RELEASE.md.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Force HTTPS for GitHub git dependencies
        run: git config --global 'url.https://github.com/.insteadOf' 'git@github.com:'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Pre-flight (dry-run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release --dry-run 2>&1 | tee /tmp/sr-dry.log
          if grep -qE '\[semantic-release\].*There are no relevant changes, so no new version is released' /tmp/sr-dry.log; then
            echo "No release to cut from this push."
            echo "released=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! grep -qE '\[semantic-release\].*The next release version is [0-9]+\.[0-9]+\.[0-9]+' /tmp/sr-dry.log; then
            echo "::error::semantic-release dry-run did not announce a next release version."
            exit 1
          fi
          echo "released=true" >> "$GITHUB_ENV"

      - name: Run semantic-release
        if: env.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Record tag
        if: env.released == 'true'
        run: |
          expected=$(grep -oE '\[semantic-release\].*The next release version is [0-9]+\.[0-9]+\.[0-9]+' /tmp/sr-dry.log \
                     | tail -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')
          if [ -z "$expected" ]; then
            echo "::error::Could not read next version from dry-run log."
            exit 1
          fi
          echo "v$expected" > version.txt
          echo "Will tag v$expected (package.json stays on git; Build bumps before packaging)."

      - name: Attach What's New
        if: env.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(cat version.txt)
          body=$(node scripts/whats-new-body.mjs "${tag#v}")
          if [ -n "$body" ]; then
            gh release edit "$tag" --notes "$body" --draft --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload version for Build & Publish
        if: env.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-version
          path: version.txt
          retention-days: 7
