name: Sync Worker GitHub Token

on:
  workflow_dispatch:

concurrency:
  group: sync-worker-github-token
  cancel-in-progress: false

# Checkout is unused; wrangler authenticates with CLOUDFLARE_API_TOKEN.
# TOKEN is secrets.GH_TOKEN and is never echoed (GitHub also masks it).
permissions:
  contents: read

jobs:
  sync:
    name: Put GITHUB_TOKEN on production Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Require GH_TOKEN
        env:
          TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "GH_TOKEN secret is empty"
            exit 1
          fi

      # Production script name is readied-api-production (packages/api/wrangler.toml
      # env.production). Pipe stdin so wrangler never prints the value.
      - name: Put GITHUB_TOKEN on readied-api-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.GH_TOKEN }}
        run: printf '%s' "$TOKEN" | npx wrangler@4.98.0 secret put GITHUB_TOKEN --name readied-api-production
