  <text x="240" y="104" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#8b5cf6"># <tspan fill="#fafafa">Q1 Project Roadmap</tspan></text>
  <text x="240" y="132" font-family="JetBrains Mono, monospace" font-size="13" fill="#a1a1aa">We decided to go local-first for v1.</text>
  <text x="240" y="152" font-family="JetBrains Mono, monospace" font-size="13" fill="#a1a1aa">Here's the breakdown.</text>
  <text x="240" y="188" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#8b5cf6">## <tspan fill="#e4e4e7">Architecture</tspan></text>
  <text x="240" y="216" font-family="JetBrains Mono, monospace" font-size="13" fill="#71717a">- <tspan fill="#a1a1aa">SQLite for local storage</tspan></text>
  <text x="240" y="240" font-family="JetBrains Mono, monospace" font-size="13" fill="#71717a">- <tspan fill="#a1a1aa">Markdown as source of truth</tspan></text>
  <text x="240" y="264" font-family="JetBrains Mono, monospace" font-size="13" fill="#71717a">- <tspan fill="#a1a1aa">No network calls in core path</tspan></text>
  <text x="240" y="300" font-family="JetBrains Mono, monospace" font-size="13" fill="#71717a">> <tspan fill="#71717a" font-style="italic">Ship fast, stay simple.</tspan></text>
  <text x="240" y="336" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#8b5cf6">## <tspan fill="#e4e4e7">Timeline</tspan></text>
  <text x="240" y="364" font-family="JetBrains Mono, monospace" font-size="13" fill="#71717a">- <tspan fill="#a1a1aa">Week 1-2: Core editor</tspan></text>
  <text x="240" y="388" font-family="JetBrains Mono, monospace" font-size="13" fill="#71717a">- <tspan fill="#a1a1aa">Week 3: File management</tspan></text>
  <text x="240" y="412" font-family="JetBrains Mono, monospace" font-size="13" fill="#71717a">- <tspan fill="#a1a1aa">Week 4: Search + backlinks</tspan></text>

