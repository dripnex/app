<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0b0d"/>
      <stop offset="100%" style="stop-color:#12141a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5eead4"/>
      <stop offset="100%" style="stop-color:#7ef3e0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent glow circle -->
  <circle cx="900" cy="315" r="200" fill="rgba(94,234,212,0.08)" filter="url(#glow)"/>

  <!-- Logo mark (stylized R) -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="60" height="150" rx="8" fill="url(#accent)"/>
    <rect x="0" y="0" width="100" height="40" rx="8" fill="url(#accent)"/>
    <rect x="60" y="0" width="40" height="80" rx="8" fill="url(#accent)"/>
    <rect x="0" y="55" width="80" height="40" rx="8" fill="url(#accent)"/>
    <rect x="50" y="80" width="50" height="70" rx="8" fill="url(#accent)" transform="rotate(30, 75, 115)"/>
  </g>

  <!-- Text: Readied -->
  <text x="220" y="335" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="700" fill="#ffffff">
    Readied
  </text>

  <!-- Tagline -->
  <text x="220" y="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.6)">
    Markdown editor for developers
  </text>

  <!-- Features -->
  <g transform="translate(220, 460)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(94,234,212,0.15)" stroke="rgba(94,234,212,0.3)" stroke-width="1"/>
    <text x="60" y="22" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">Offline-first</text>

    <rect x="140" y="0" width="130" height="32" rx="16" fill="rgba(94,234,212,0.15)" stroke="rgba(94,234,212,0.3)" stroke-width="1"/>
    <text x="205" y="22" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">Local files</text>

    <rect x="290" y="0" width="130" height="32" rx="16" fill="rgba(94,234,212,0.15)" stroke="rgba(94,234,212,0.3)" stroke-width="1"/>
    <text x="355" y="22" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#5eead4" text-anchor="middle">Pure Markdown</text>
  </g>

  <!-- Border accent line at top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
</svg>
