name = "dripnex-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Default environment (development/local)
[vars]
ENVIRONMENT = "development"

# Rate limiting (Workers Rate Limiting API, GA). namespace_id is a self-assigned
# integer — no resource to provision. period must be 10 or 60.
[[ratelimits]]
name = "AUTH_RL"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SYNC_RL"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

[[ratelimits]]
name = "PUBLIC_RL"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Staging environment
[env.staging]
name = "dripnex-api-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.ratelimits]]
name = "AUTH_RL"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "SYNC_RL"
namespace_id = "2002"
simple = { limit = 100, period = 60 }

[[env.staging.ratelimits]]
name = "PUBLIC_RL"
namespace_id = "2003"
simple = { limit = 60, period = 60 }

# Production script name stays readied-api-production until its secrets
# (Turso / JWT / Resend) are re-keyed onto dripnex-api-production.
[env.production]
name = "readied-api-production"
workers_dev = true
vars = { ENVIRONMENT = "production" }

# Apex dripnex.app is the marketing site (Pages). This Worker owns the API host.
[[env.production.routes]]
pattern = "api.dripnex.app"
custom_domain = true

[[env.production.ratelimits]]
name = "AUTH_RL"
namespace_id = "3001"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "SYNC_RL"
namespace_id = "3002"
simple = { limit = 100, period = 60 }

[[env.production.ratelimits]]
name = "PUBLIC_RL"
namespace_id = "3003"
simple = { limit = 60, period = 60 }

# Secrets (set via wrangler secret put):
# - Development: wrangler secret put <KEY>
# - Staging: wrangler secret put <KEY> --env staging
# - Production: wrangler secret put <KEY> --env production
#
# Required secrets:
# TURSO_DATABASE_URL - libsql://your-db.turso.io
# TURSO_AUTH_TOKEN - Token from turso db tokens create
# JWT_SECRET - Secret for signing JWTs (generate with: openssl rand -base64 32)
# RESEND_API_KEY - API key for Resend email service
# STRIPE_WEBHOOK_SECRET - Stripe webhook signing secret
# LICENSE_SIGNING_PRIVATE_KEY - Ed25519 private key (hex) used to sign
#   SignedSubscriptionEnvelope payloads. The matching public key is
#   embedded in apps/desktop/src/main/services/fileLicenseStorage.ts
#   (SUBSCRIPTION_PUBLIC_KEY). Rotation requires shipping a new desktop
#   release with the new public key FIRST — see that file's comment.
